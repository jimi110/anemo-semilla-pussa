<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SeedMap · Mapa de semillas de Minecraft Java</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.4 system-ui,-apple-system,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
aside{background:#161b22;border-right:1px solid #2a3340;overflow-y:auto;padding:14px}
h1{font-size:17px;margin:0 0 2px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b98a8;margin:18px 0 8px}
.sub{color:#8b98a8;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label{display:block;font-size:11px;color:#8b98a8;margin-bottom:3px}
input,select,button{width:100%;padding:8px 10px;border:1px solid #30394a;border-radius:8px;background:#0d1117;color:#e6edf3;font:inherit}
button.p{background:#2f81f7;border-color:#2f81f7;font-weight:600;cursor:pointer;margin-top:10px}button.s{cursor:pointer;background:#21293a}
#eng{font-size:11px;color:#3fb950;margin-top:6px}#warn{font-size:12px;color:#d29922;margin-top:6px}
#map{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#0b1a2a}
#st{position:absolute;left:10px;bottom:10px;background:#000b;padding:5px 10px;border-radius:8px;font-size:12px;pointer-events:none}
#sc{position:absolute;right:10px;bottom:10px;color:#fff;font-size:11px;text-shadow:0 0 3px #000;text-align:center;pointer-events:none}
#sc i{display:block;height:5px;border:2px solid #fff;border-top:0;margin-top:2px}
#zb{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}#zb button{width:38px;height:38px;padding:0;font-size:20px;background:#161b22e6;cursor:pointer}
#info{position:absolute;left:10px;top:10px;background:#161b22f2;border:1px solid #30394a;border-radius:10px;padding:10px 12px;display:none;min-width:200px}
#info b{display:block;margin-bottom:2px}#info button{margin-top:8px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border:1px solid #30394a;border-radius:20px;cursor:pointer;font-size:12px;user-select:none}.chip.off{opacity:.35}.chip img{width:20px;height:20px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:4px;border-bottom:1px solid #2a3340;text-align:center}td:first-child,th:first-child{text-align:left}
.li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid #2a3340;cursor:pointer;font-size:12px}.li:hover{background:#21293a}.li img{width:22px;height:22px}.li span{margin-left:auto;color:#8b98a8}
#msg{padding:12px;color:#d29922;font-size:13px}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:56dvh 1fr}#map{order:-1}aside{border-right:0;border-top:1px solid #2a3340}}
</style></head><body>
<div id="app"><aside>
<h1>🌍 SeedMap</h1><div class="sub">Minecraft Java · biomas y estructuras reales</div>
<div id="msg">Cargando motor…</div>
<h2>Semilla</h2>
<label>Semilla (número o texto)</label><input id="seed" value="12345" autocomplete="off">
<div class="row"><div><label>Versión</label><select id="ver"><option value="newest">26.3 (última)</option><option>1.21</option><option>1.20</option><option>1.19</option><option>1.18</option><option>1.17</option><option>1.16</option></select></div>
<div><label>Zonas</label><select id="zn"><option value="1">Sin dividir</option><option value="4" selected>4 zonas</option><option value="8">8 zonas</option></select></div>
<div><label>Radio mínimo</label><input id="rmin" type="number" value="0" min="0"></div>
<div><label>Radio máximo</label><input id="rmax" type="number" value="3000" min="100" max="15000"></div></div>
<button class="p" id="go">Generar mapa</button><div id="eng"></div><div id="warn"></div>
<h2>Estructuras</h2><div class="chips" id="leg"></div>
<h2>Recuento por zona</h2><div id="tab"></div>
<h2>Ir a coordenadas</h2><div class="row"><div><label>X</label><input id="gx" type="number" value="0"></div><div><label>Z</label><input id="gz" type="number" value="0"></div></div><button class="s" id="gb" style="margin-top:8px">Ir</button>
<h2>Más cercanas al spawn</h2><div id="near"></div>
</aside>
<div id="map"><canvas id="c"></canvas><div id="st">Genera un mapa</div><div id="sc"></div>
<div id="zb"><button id="zi">+</button><button id="zo">−</button></div><div id="info"></div></div></div>
<script src="cubiomes.js"></script>
<script>
const DEF={
Village:["Aldea","#c2762f","M12 5 L20 12 H17 V19 H7 V12 H4 Z"],
Desert_Pyramid:["Templo del desierto","#d4a73a","M12 5 L21 19 H3 Z"],
Jungle_Pyramid:["Templo de la jungla","#2e9e4f","M12 5 L21 19 H3 Z M12 11 L16 19 H8 Z"],
Swamp_Hut:["Cabaña de bruja","#6b4f9e","M4 12 L12 6 L20 12 V19 H4 Z M10 19 V14 H14 V19"],
Igloo:["Iglú","#5fb4d9","M4 19 A8 8 0 0 1 20 19 Z"],
Monument:["Monumento oceánico","#1f7fa8","M7 6 V16 M12 5 V19 M17 6 V16 M7 12 H17"],
Mansion:["Mansión del bosque","#7a3b2e","M4 19 V9 L8 6 L12 9 L16 6 L20 9 V19 Z"],
Outpost:["Avanzada pillager","#8a2d2d","M8 19 V8 H6 V5 H18 V8 H16 V19 Z"],
Ancient_City:["Ciudad ancestral","#1e5a66","M12 5 C7 5 6 9 7 12 V16 H10 V19 H14 V16 H17 V12 C18 9 17 5 12 5 Z"],
Ruined_Portal:["Portal en ruinas","#8b3fd1","M7 5 H17 V19 H7 Z M10 8 V16 H14 V8 Z"],
Shipwreck:["Naufragio","#9c6b3c","M3 13 H21 L18 19 H6 Z M11 5 V13"],
Ocean_Ruin:["Ruina oceánica","#3b7a8c","M5 19 V9 H9 V19 M11 19 V6 H15 V19 M17 19 V12 H20 V19"],
Trail_Ruins:["Ruinas del sendero","#b5651d","M5 19 L9 9 L13 15 L16 7 L20 19 Z"],
Trial_Chambers:["Cámara de pruebas","#d96b2b","M12 4 L20 12 L12 20 L4 12 Z M12 9 L15 12 L12 15 L9 12 Z"],
Treasure:["Tesoro enterrado","#b8860b","M5 8 H19 V18 H5 Z M5 12 H19 M11 12 V15 H13 V12"],
Abandoned_Camp:["Campamento abandonado","#c0562b","M12 4 C14 8 17 10 17 14 A5 5 0 0 1 7 14 C7 11 9 10 10 8 C11 9 12 7 12 4 Z"]};
const SPAWN=new Path2D("M12 3 L14.6 9 L21 9.6 L16.2 13.8 L17.6 20 L12 16.8 L6.4 20 L7.8 13.8 L3 9.6 L9.4 9 Z");
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
let M,api={},cur=null,NAMES=[],P=[],on=[],res=[],sel=null,sp=[0,0],pal=[],V={x:0,z:0,bpp:8},W=1,H=1,R=3000,RMIN=0,cache=new Map(),budget=0,more=false;
function icon(c,x,y,r,col,path){c.save();c.translate(x,y);c.scale(r/12,r/12);c.beginPath();c.arc(0,0,12,0,7);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
 c.translate(-8.4,-8.4);c.scale(.7,.7);c.fillStyle='#fff';c.strokeStyle='#fff';c.lineWidth=1.8;c.lineJoin='round';c.fill(path,'evenodd');c.stroke(path);c.restore()}
function iconURL(i){const k=document.createElement('canvas');k.width=k.height=44;icon(k.getContext('2d'),22,22,20,NAMES[i][1],P[i]);return k.toDataURL()}
createCubiomes({locateFile:f=>f}).then(m=>{M=m;
 for(const[n,r,a]of[['init','number',['string','number','number']],['mc_name','string',[]],['st_count','number',[]],['st_key','string',['number']],['tile','number',['number','number','number']],['biome_at','number',['number','number']],['bname','string',['number']],['cols_ptr','number',[]],['spawn_x','number',[]],['spawn_z','number',[]],['find_ptr','number',[]],['find_structs','number',['number','number','number','number','number']]])api[n]=M.cwrap(n,r,a);
 for(let i=0;i<api.st_count();i++){const k=api.st_key(i);NAMES.push(DEF[k]||[k.replace(/_/g,' '),'#667788','M12 5 L20 12 L12 19 L4 12 Z']);P.push(new Path2D(NAMES[i][2]));on.push(true)}
 $('msg').remove();size();load();$('go').click()}).catch(e=>{$('msg').textContent='Falta cubiomes.js / cubiomes.wasm. Ve a la pestaña Actions de GitHub y ejecuta "Compilar cubiomes".'});
function size(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',size);
function load(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('seed'))$('seed').value=h.get('seed');if(h.get('min'))$('rmin').value=h.get('min');if(h.get('max'))$('rmax').value=h.get('max')}
function seedParse(t){t=t.trim();if(/^-?\d+$/.test(t))return BigInt.asIntN(64,BigInt(t));let h=0;for(const c of t)h=(Math.imul(31,h)+c.charCodeAt(0))|0;return BigInt(h)}
function zone(x,z,n){if(n==1)return 0;let a=Math.atan2(x,-z);if(a<0)a+=2*Math.PI;return Math.floor(a/(2*Math.PI/n))%n}
$('go').onclick=()=>{if(!M)return;const s=seedParse($('seed').value);
 cur=api.init($('ver').value,Number(BigInt.asIntN(32,s)),Number(BigInt.asIntN(32,s>>32n)));
 if(cur<0){alert('Versión no soportada por el motor');return}
 const en=api.mc_name();$('eng').textContent='Motor: Minecraft '+en;$('warn').textContent=($('ver').value==='newest'&&!/26/.test(en))?'Aviso: el motor compilado no es 26.x ('+en+'). Revisa build.yml.':'';
 const cp=api.cols_ptr(),c=M.HEAPU8.slice(cp,cp+768);pal=[];for(let i=0;i<256;i++){const z=c[i*3]+c[i*3+1]+c[i*3+2]===0;pal.push(z?[70,70,84]:[c[i*3],c[i*3+1],c[i*3+2]])}
 cache.clear();sp=[api.spawn_x(),api.spawn_z()];sel=null;$('info').style.display='none';
 RMIN=+$('rmin').value||0;R=Math.min(Math.max(+$('rmax').value||3000,100),15000);res=[];
 for(let i=0;i<NAMES.length;i++){const n=api.find_structs(i,-R,-R,R,R),p=api.find_ptr()>>2,h=M.HEAP32;
  for(let j=0;j<n;j++){const x=h[p+2*j],z=h[p+2*j+1],d=Math.hypot(x,z);if(d>=RMIN&&d<=R)res.push({i,x,z,d:Math.hypot(x-sp[0],z-sp[1])})}}
 history.replaceState(null,'','#seed='+encodeURIComponent($('seed').value)+'&min='+RMIN+'&max='+R);
 V={x:0,z:0,bpp:2.4*R/Math.min(W,H)};legend();table();near();draw()};
function legend(){$('leg').innerHTML='';NAMES.forEach((n,i)=>{const d=document.createElement('div');d.className='chip'+(on[i]?'':' off');
 d.innerHTML='<img src="'+iconURL(i)+'">'+n[0];d.onclick=()=>{on[i]=!on[i];legend();near();draw()};$('leg').appendChild(d)})}
function table(){const nz=+$('zn').value,lab=nz==4?['NE','SE','SO','NO']:nz==8?['NNE','ENE','ESE','SSE','SSO','OSO','ONO','NNO']:['Todo'];
 const c=NAMES.map(()=>Array(nz).fill(0));res.forEach(r=>c[r.i][zone(r.x,r.z,nz)]++);
 let h='<table><tr><th></th>'+lab.map(l=>'<th>'+l+'</th>').join('')+(nz>1?'<th>Σ</th>':'')+'</tr>';
 NAMES.forEach((n,i)=>{const t=c[i].reduce((a,b)=>a+b,0);if(t)h+='<tr><td><img src="'+iconURL(i)+'" width="16" style="vertical-align:middle"> '+n[0]+'</td>'+c[i].map(v=>'<td>'+v+'</td>').join('')+(nz>1?'<td><b>'+t+'</b></td>':'')+'</tr>'});
 $('tab').innerHTML=h+'</table>';draw()}
$('zn').onchange=table;
function near(){const l=res.filter(o=>on[o.i]).sort((a,b)=>a.d-b.d).slice(0,40);$('near').innerHTML='';
 l.forEach(o=>{const d=document.createElement('div');d.className='li';d.innerHTML='<img src="'+iconURL(o.i)+'">'+NAMES[o.i][0]+'<span>'+o.x+', '+o.z+' · '+Math.round(o.d)+'m</span>';d.onclick=()=>{fly(o.x,o.z);select(o)};$('near').appendChild(d)})}
function fly(x,z){V.x=x;V.z=z;V.bpp=Math.min(V.bpp,6);draw()}
$('gb').onclick=()=>fly(+$('gx').value||0,+$('gz').value||0);
function select(o){sel=o;const el=$('info');if(!o){el.style.display='none';draw();return}
 el.innerHTML='<b>'+NAMES[o.i][0]+'</b>X '+o.x+' · Z '+o.z+'<br><span class="sub">'+Math.round(o.d)+' bloques del spawn</span><button class="s" id="cp">Copiar /tp</button>';el.style.display='block';
 $('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText('/tp @s '+o.x+' ~ '+o.z);$('cp').textContent='¡Copiado!'};draw()}
function getTile(s,tx,tz){const k=s+'|'+tx+'|'+tz;let t=cache.get(k);if(t)return t;if(budget--<=0){more=true;return null}
 if(cache.size>700)cache.clear();
 const p=api.tile(s,tx*128,tz*128),b=M.HEAPU8.slice(p,p+16384);
 t=document.createElement('canvas');t.width=t.height=128;const x=t.getContext('2d'),im=x.createImageData(128,128);
 for(let i=0;i<16384;i++){const c=pal[b[i]]||pal[0];im.data[i*4]=c[0];im.data[i*4+1]=c[1];im.data[i*4+2]=c[2];im.data[i*4+3]=255}
 x.putImageData(im,0,0);cache.set(k,t);return t}
const sx=x=>(x-V.x)/V.bpp+W/2,sz=z=>(z-V.z)/V.bpp+H/2;
function draw(){if(!M)return;g.fillStyle='#0b1a2a';g.fillRect(0,0,W,H);if(!cur)return;g.imageSmoothingEnabled=false;
 const s=[256,64,16,4,1].find(v=>v<=Math.max(1,V.bpp))||1,ts=128*s;
 const x0=Math.floor((V.x-W/2*V.bpp)/ts),x1=Math.floor((V.x+W/2*V.bpp)/ts),z0=Math.floor((V.z-H/2*V.bpp)/ts),z1=Math.floor((V.z+H/2*V.bpp)/ts);
 budget=10;more=false;
 for(let tz=z0;tz<=z1;tz++)for(let tx=x0;tx<=x1;tx++){const t=getTile(s,tx,tz);if(t)g.drawImage(t,sx(tx*ts),sz(tz*ts),ts/V.bpp+.6,ts/V.bpp+.6)}
 const nz=+$('zn').value;g.lineWidth=2;g.strokeStyle='#fff';g.setLineDash([]);
 g.beginPath();g.arc(sx(0),sz(0),R/V.bpp,0,7);g.stroke();
 if(RMIN>0){g.setLineDash([8,6]);g.beginPath();g.arc(sx(0),sz(0),RMIN/V.bpp,0,7);g.stroke();g.setLineDash([])}
 if(nz>1){g.globalAlpha=.55;g.lineWidth=1;for(let i=0;i<nz;i++){const a=i*2*Math.PI/nz;g.beginPath();g.moveTo(sx(0),sz(0));g.lineTo(sx(Math.sin(a)*R),sz(-Math.cos(a)*R));g.stroke()}g.globalAlpha=1}
 const r=Math.max(9,Math.min(14,150/V.bpp+8));
 res.forEach(o=>{if(!on[o.i])return;const x=sx(o.x),z=sz(o.z);if(x<-20||z<-20||x>W+20||z>H+20)return;icon(g,x,z,r,NAMES[o.i][1],P[o.i])});
 if(sel){g.strokeStyle='#ffd33d';g.lineWidth=3;g.beginPath();g.arc(sx(sel.x),sz(sel.z),r+5,0,7);g.stroke()}
 icon(g,sx(sp[0]),sz(sp[1]),r+3,'#e6a800',SPAWN);
 const L=[50,100,250,500,1000,2500,5000,10000].find(v=>v/V.bpp>=70)||10000;$('sc').innerHTML=L+' bloques<i style="width:'+L/V.bpp+'px"></i>';
 if(more)requestAnimationFrame(draw)}
const pts=new Map();let mv=0,pinch=0;
const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});mv=0;if(pts.size==2)pinch=dist()};
cv.onpointermove=e=>{const b=cv.getBoundingClientRect(),p=pts.get(e.pointerId);
 if(p){if(pts.size==1){const dx=e.clientX-p.x,dy=e.clientY-p.y;mv+=Math.abs(dx)+Math.abs(dy);V.x-=dx*V.bpp;V.z-=dy*V.bpp;p.x=e.clientX;p.y=e.clientY;draw()}
  else{p.x=e.clientX;p.y=e.clientY;const d=dist(),a=[...pts.values()];if(pinch)zoom(pinch/d,(a[0].x+a[1].x)/2-b.left,(a[0].y+a[1].y)/2-b.top);pinch=d;mv+=9}return}
 if(!cur)return;const mx=e.clientX-b.left,my=e.clientY-b.top,wx=Math.round(V.x+(mx-W/2)*V.bpp),wz=Math.round(V.z+(my-H/2)*V.bpp);
 let t=api.bname(api.biome_at(wx,wz))+' · X '+wx+' Z '+wz;const o=hit(mx,my);if(o)t=NAMES[o.i][0]+' · X '+o.x+' Z '+o.z;
 if(Math.abs(sx(sp[0])-mx)<14&&Math.abs(sz(sp[1])-my)<14)t='Spawn · X '+sp[0]+' Z '+sp[1];$('st').textContent=t};
cv.onpointerup=e=>{if(pts.size==1&&mv<6){const b=cv.getBoundingClientRect();select(hit(e.clientX-b.left,e.clientY-b.top))}pts.delete(e.pointerId);pinch=0};
cv.onpointercancel=e=>{pts.delete(e.pointerId);pinch=0};
function hit(mx,my){let best=null,bd=18;for(const o of res){if(!on[o.i])continue;const d=Math.hypot(sx(o.x)-mx,sz(o.z)-my);if(d<bd){bd=d;best=o}}return best}
function zoom(f,mx=W/2,my=H/2){const n=Math.min(500,Math.max(.25,V.bpp*f)),wx=V.x+(mx-W/2)*V.bpp,wz=V.z+(my-H/2)*V.bpp;V.bpp=n;V.x=wx-(mx-W/2)*n;V.z=wz-(my-H/2)*n;draw()}
cv.onwheel=e=>{e.preventDefault();const b=cv.getBoundingClientRect();zoom(Math.exp(e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)};
$('zi').onclick=()=>zoom(.6);$('zo').onclick=()=>zoom(1/.6);
$('seed').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
</script></body></html>
