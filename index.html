  palK.push(col);isW.push(/ocean|river/.test(n)&&!/frozen/.test(n));dry.push(/desert|badlands|beach|stony|ice/.test(n))}}
function clearAll(){ic.clear();hc.clear();cc.clear();if(ren){for(const m of mesh3.values()){sc.remove(m);m.geometry.dispose();m.material.map.dispose();m.material.dispose()}mesh3.clear();for(const p of spr3.values())sc.remove(p);spr3.clear()}}
function getIds(s,tx,tz){const k=s+'|'+tx+'|'+tz;let a=ic.get(k);if(a)return a;if(ic.size>800)ic.clear();const p=api.tile(s,tx*128,tz*128);a=M.HEAPU8.slice(p,p+16384);ic.set(k,a);return a}
function getH(s,tx,tz){const k=s+'|'+tx+'|'+tz;let a=hc.get(k);if(a)return a;if(hc.size>1500)hc.clear();const p=api.htile(s,tx,tz)>>2;a=M.HEAPF32.slice(p,p+1089);hc.set(k,a);return a}
function paintK(d,ids,Hh,s){const sp=4*s;let gx,gz;
 if(Hh){gx=new Float32Array(1089);gz=new Float32Array(1089);const h=(c,r)=>Hh[Math.min(32,Math.max(0,r))*33+Math.min(32,Math.max(0,c))];
  for(let r=0;r<33;r++)for(let c=0;c<33;c++){gx[r*33+c]=(h(c+1,r)-h(c-1,r))/(2*sp);gz[r*33+c]=(h(c,r+1)-h(c,r-1))/(2*sp)}}
 for(let j=0;j<128;j++)for(let i=0;i<128;i++){const id=ids[j*128+i],B=palK[id]||palK[0];let h=63,sh=1;
  if(Hh){const u=i/4,v=j/4,c=Math.min(31,u|0),r=Math.min(31,v|0),fx=u-c,fz=v-r,o=r*33+c,w0=(1-fx)*(1-fz),w1=fx*(1-fz),w2=(1-fx)*fz,w3=fx*fz;
   h=Hh[o]*w0+Hh[o+1]*w1+Hh[o+33]*w2+Hh[o+34]*w3;const a=gx[o]*w0+gx[o+1]*w1+gx[o+33]*w2+gx[o+34]*w3,b=gz[o]*w0+gz[o+1]*w1+gz[o+33]*w2+gz[o+34]*w3;
   sh=1+Math.max(-.4,Math.min(.4,(a+b)*.5*(1+s*.1)))}
  let R_=B[0],G_=B[1],B_=B[2];
  if(isW[id]){const t=Math.max(0,Math.min(1,(63-h)/50))*.7;R_+=(20-R_)*t;G_+=(45-G_)*t;B_+=(120-B_)*t;sh=1+(sh-1)*.3}
  else if(h>205){R_=245;G_=248;B_=250}
  else if(h>135&&!dry[id]){const t=Math.min(1,(h-135)/45);R_+=(125-R_)*t;G_+=(125-G_)*t;B_+=(125-B_)*t}
  const o4=(j*128+i)*4;d[o4]=Math.min(255,R_*sh);d[o4+1]=Math.min(255,G_*sh);d[o4+2]=Math.min(255,B_*sh);d[o4+3]=255}}
function buildCanvas(m,s,tx,tz){const ids=getIds(s,tx,tz),t=document.createElement('canvas');t.width=t.height=128;const x=t.getContext('2d'),im=x.createImageData(128,128),d=im.data;
 if(m==='b'){for(let i=0;i<16384;i++){const c=palB[ids[i]]||palB[0];d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255}}
 else paintK(d,ids,hOk?getH(s,tx,tz):null,s);
 x.putImageData(im,0,0);return t}
function getCanvas(m,s,tx,tz){const k=m+s+'|'+tx+'|'+tz;let t=cc.get(k);if(t)return t;const cost=m==='k'&&hOk?4:1;if(budget<cost){more=true;return null}budget-=cost;
 if(cc.size>500)cc.clear();t=buildCanvas(m,s,tx,tz);cc.set(k,t);return t}
function redraw(){mode==='3'?(d3=true):draw()}
function hAt(x,z){for(const s of [1,4,16,64,256]){const ts=128*s,tx=Math.floor(x/ts),tz=Math.floor(z/ts),Hh=hc.get(s+'|'+tx+'|'+tz);if(Hh){const gx=(x-tx*ts)/(4*s),gz=(z-tz*ts)/(4*s),i=Math.min(31,gx|0),j=Math.min(31,gz|0),fx=gx-i,fz=gz-j,o=j*33+i;
  return Math.max(62.5,Hh[o]*(1-fx)*(1-fz)+Hh[o+1]*fx*(1-fz)+Hh[o+33]*(1-fx)*fz+Hh[o+34]*fx*fz)}}return 70}
/* ===== Vista 3D ===== */
let ren=null,sc,cam,mesh3=new Map(),spr3=new Map(),sm=[],T={x:0,z:0,yaw:.6,pitch:.75,dist:2000,ve:2},d3=true,s3=1,pan3=false;
const c3=$('c3'),rc=typeof THREE!=='undefined'?new THREE.Raycaster():null;
function init3(){if(ren)return;ren=new THREE.WebGLRenderer({canvas:c3,antialias:true});sc=new THREE.Scene();sc.background=new THREE.Color(0x8fbfee);
 cam=new THREE.PerspectiveCamera(50,W/H,2,500000);sc.add(new THREE.HemisphereLight(0xffffff,0x667788,.85));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(-1,2,-1);sc.add(dl);
 ren.setPixelRatio(devicePixelRatio||1);ren.setSize(W,H,false)}
function mkMesh(s,tx,tz){if(budget<5)return null;budget-=5;const ts=128*s,Hh=getH(s,tx,tz),k='k'+s+'|'+tx+'|'+tz;let cv_=cc.get(k);if(!cv_){cv_=buildCanvas('k',s,tx,tz);cc.set(k,cv_)}
 const geo=new THREE.PlaneGeometry(ts,ts,32,32);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position;for(let n=0;n<pos.count;n++)pos.setY(n,Math.max(62.5,Hh[n]));geo.computeVertexNormals();
 const tex=new THREE.CanvasTexture(cv_);tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
 const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:tex}));m.position.set(tx*ts+ts/2,0,tz*ts+ts/2);m.scale.y=T.ve;m.userData.tile=1;sc.add(m);return m}
function spriteMat(i){if(!sm[i]){const k=document.createElement('canvas');k.width=k.height=64;icon(k.getContext('2d'),32,32,29,NAMES[i][1],P[i]);sm[i]=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),sizeAttenuation:false,depthTest:false})}return sm[i]}
function sync3D(){const E=Math.min(T.dist*2.4,60000),s=[1,4,16,64,256].find(v=>128*v>=2*E/9)||256,ts=128*s;
 if(s!==s3){for(const m of mesh3.values()){sc.remove(m);m.geometry.dispose();m.material.map.dispose();m.material.dispose()}mesh3.clear();s3=s}
 const tx0=Math.floor((T.x-E)/ts),tx1=Math.floor((T.x+E)/ts),tz0=Math.floor((T.z-E)/ts),tz1=Math.floor((T.z+E)/ts),L=[];
 for(let tz=tz0;tz<=tz1;tz++)for(let tx=tx0;tx<=tx1;tx++)L.push([tx,tz,Math.hypot((tx+.5)*ts-T.x,(tz+.5)*ts-T.z)]);L.sort((a,b)=>a[2]-b[2]);
 budget=15;let pend=false;const need=new Set();
 for(const[tx,tz]of L){const k=tx+'|'+tz;need.add(k);if(!mesh3.has(k)){const m=mkMesh(s,tx,tz);if(m)mesh3.set(k,m);else pend=true}}
 for(const[k,m]of mesh3)if(!need.has(k)){sc.remove(m);m.geometry.dispose();m.material.map.dispose();m.material.dispose();mesh3.delete(k)}
 sc.fog=new THREE.Fog(0x8fbfee,E*.55,E*1.1);
 const all=[...res.map(o=>({o,i:o.i,x:o.x,z:o.z,sp:0})),{o:null,i:-1,x:sp[0],z:sp[1],sp:1}];
 for(const a of all){let p=spr3.get(a.o||'sp');if(!p){p=new THREE.Sprite(a.sp?spawnMat():spriteMat(a.i));p.scale.set(.05,.05,1);p.userData.o=a.o;p.renderOrder=9;sc.add(p);spr3.set(a.o||'sp',p)}
  const vis=(a.sp||on[a.i])&&Math.hypot(a.x-T.x,a.z-T.z)<E;p.visible=vis;if(vis)p.position.set(a.x,hAt(a.x,a.z)*T.ve+8*T.ve,a.z)}
 $('ld').style.display=pend?'block':'none';return pend}
let spm=null;function spawnMat(){if(!spm){const k=document.createElement('canvas');k.width=k.height=64;icon(k.getContext('2d'),32,32,29,'#e6a800',SPAWN);spm=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),sizeAttenuation:false,depthTest:false})}return spm}
function cam3(){const ty=hAt(T.x,T.z)*T.ve;cam.position.set(T.x+T.dist*Math.cos(T.pitch)*Math.sin(T.yaw),ty+T.dist*Math.sin(T.pitch),T.z+T.dist*Math.cos(T.pitch)*Math.cos(T.yaw));cam.lookAt(T.x,ty,T.z)}
function loop3(){if(mode!=='3')return;if(d3){d3=sync3D();cam3();ren.render(sc,cam)}requestAnimationFrame(loop3)}
function setMode(m){const prev=mode;mode=m;document.querySelectorAll('#md button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 cv.style.display=m==='3'?'none':'block';c3.style.display=m==='3'?'block':'none';$('rv').style.display=m==='3'?'flex':'none';$('ld').style.display='none';
 if(m==='3'){init3();T.x=V.x;T.z=V.z;T.dist=Math.max(300,V.bpp*H*.8);size();d3=true;loop3()}
 else{if(prev==='3'){V.x=T.x;V.z=T.z;V.bpp=Math.max(.25,T.dist/(H*.8))}draw()}}
document.querySelectorAll('#md button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('ve').oninput=e=>{T.ve=+e.target.value;for(const m of mesh3.values())m.scale.y=T.ve;d3=true};
$('pn').onclick=()=>{pan3=!pan3;$('pn').classList.toggle('on',pan3)};
const p3=new Map();let mv3=0,pin3=0,btn3=0,hv=false;
const dd3=()=>{const a=[...p3.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function panBy(dx,dy){const k=T.dist*.0013,c=Math.cos(T.yaw),s=Math.sin(T.yaw);T.x+=-dx*k*c+dy*k*(-s);T.z+=dx*k*s+dy*k*(-c)}
c3.oncontextmenu=e=>e.preventDefault();
c3.onpointerdown=e=>{c3.setPointerCapture(e.pointerId);p3.set(e.pointerId,{x:e.clientX,y:e.clientY});mv3=0;btn3=e.button;if(p3.size==2)pin3=dd3()};
c3.onpointermove=e=>{const p=p3.get(e.pointerId);if(!p){hover3(e);return}const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(p3.size==1){mv3+=Math.abs(dx)+Math.abs(dy);if(btn3===2||e.shiftKey||pan3)panBy(dx,dy);else{T.yaw-=dx*.006;T.pitch=Math.min(1.5,Math.max(.1,T.pitch+dy*.005))}}
 else{const d=dd3();if(pin3)T.dist=Math.min(40000,Math.max(60,T.dist*pin3/d));pin3=d;mv3+=9}d3=true};
c3.onpointerup=e=>{if(p3.size==1&&mv3<6)pick3(e);p3.delete(e.pointerId);pin3=0};c3.onpointercancel=e=>{p3.delete(e.pointerId);pin3=0};
c3.onwheel=e=>{e.preventDefault();T.dist=Math.min(40000,Math.max(60,T.dist*Math.exp(e.deltaY*.0015)));d3=true};
function ndc(e){const b=c3.getBoundingClientRect();return new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1)}
function pick3(e){rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects([...spr3.values()].filter(p=>p.visible&&p.userData.o));select(h.length?h[0].object.userData.o:null)}
function hover3(e){if(hv||!cur)return;hv=true;requestAnimationFrame(()=>{hv=false;rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects([...mesh3.values()]);if(h.length){const x=Math.round(h[0].point.x),z=Math.round(h[0].point.z);$('st').textContent=api.bname(api.biome_at(x,z))+' · X '+x+' Z '+z+' · Y≈'+Math.round(h[0].point.y/T.ve)}})}
